name: Sync Upstream Repositories

on:
  workflow_dispatch:

jobs:
  sync_base:
    runs-on: ubuntu-latest
    steps:
      - name: Set up git config
        run: |
          git config --global user.name "ronardnx"
          git config --global user.email "dragosh.rotaru.dragosh@gmail.com"

      - name: Sync frameworks_base directly from Project-PenguinOS
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git clone --branch celerity "https://github.com/Project-PenguinOS/frameworks_base.git" base_dir
          cd base_dir
          git remote add target "https://x-access-token:${SYNC_PAT}@github.com/clo-for-giulia/penguin_frameworks_base.git"
          git fetch target celerity
          echo "Cherry-picking custom commit..."
          git cherry-pick 4e815dc9f969161e6e4c4a268abc62cea1e66801
          echo "Force-pushing updated celerity branch to clo-for-giulia/penguin_frameworks_base..."
          git push --force target celerity
